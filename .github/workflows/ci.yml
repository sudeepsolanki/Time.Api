name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
 
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up .NET9
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore Time.Api.sln

      - name: Build
        run: dotnet build Time.Api.sln --configuration Release --no-restore

      - name: Run Test
        run: dotnet test Time.Api.sln --no-build --verbosity normal